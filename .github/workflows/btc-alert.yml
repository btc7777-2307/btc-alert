name: BTC 신호 알림

# GitHub 예약 실행은 수십 분씩 늦어서, 한 번 켜지면 약 5시간 반 동안 5분마다 스스로 확인한다.
# 끝날 때쯤엔 예약(20분마다)으로 대기 중이던 다음 실행이 바로 이어 받는다 (같은 그룹은 하나만 실행).
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:  # Actions 화면의 "Run workflow"
    inputs:
      test:
        description: "테스트 메시지만 보내기"
        type: boolean
        default: false

permissions:
  contents: write  # state.json(보낸 알림 기록) 저장용

jobs:
  watch:
    if: ${{ !inputs.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 345
    concurrency:
      group: btc-alert-watch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 5분마다 신호 확인 후 텔레그램 전송 (약 5시간 반)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://btc7777-2307.github.io/btc-alert/
          SEED_KRW: ${{ vars.SEED_KRW }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          LEVERAGE: ${{ vars.LEVERAGE }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in $(seq 1 66); do
            git pull -q --rebase origin main || true          # 그사이 바뀐 코드·기록 반영
            python3 btc_notify.py || echo "이번 확인 실패, 5분 뒤 다시"
            if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
              git add state.json && git commit -q -m "알림 기록 갱신"
              git push -q || (git pull -q --rebase origin main && git push -q) || echo "기록 저장 실패, 다음에 다시"
            fi
            sleep 290
          done

  test:
    if: ${{ inputs.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 테스트 메시지 보내기
        run: python3 btc_notify.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: "true"
          DASHBOARD_URL: https://btc7777-2307.github.io/btc-alert/
          SEED_KRW: ${{ vars.SEED_KRW }}
          RISK_PCT: ${{ vars.RISK_PCT }}
          LEVERAGE: ${{ vars.LEVERAGE }}
