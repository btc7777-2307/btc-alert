name: BTC 신호 알림

on:
  schedule:
    - cron: "*/5 * * * *"  # 5분마다 (GitHub 사정으로 몇 분~수십 분 늦어질 수 있음)
  workflow_dispatch:  # Actions 화면에서 "Run workflow"로 바로 실행
    inputs:
      test:
        description: "테스트 메시지 보내기"
        type: boolean
        default: true

permissions:
  contents: write  # state.json(보낸 알림 기록) 저장용

concurrency:
  group: btc-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 신호 확인 후 텔레그램 전송
        run: python3 btc_notify.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_MESSAGE: ${{ inputs.test }}

      - name: 보낸 알림 기록 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f state.json ] || exit 0
          git add state.json
          git diff --cached --quiet || (git commit -m "알림 기록 갱신" && git push)
